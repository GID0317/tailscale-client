name: Build Portable Preview

on:
  push:
    branches:
      - '**'
    tags:
      - v**

jobs:
  build:
    name: Build portable packages
    runs-on: windows-latest

    steps:
      - name: Check out repository, with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install windows 10 SDK
        uses: GuillaumeFalourd/setup-windows10-sdk-action@v2
        with:
          sdk-version: '22000'

      - name: Add Win10 SDK to PATH
        run: |
          Add-Content $env:GITHUB_PATH "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22000.0\x64"

      - name: Build x64 and ARM64
        run: |
          dotnet restore
          dotnet publish TailscaleClient.csproj -p:Platform=x64 -c Release -r win-x64 --self-contained true -o ./dist/x64/
          dotnet publish TailscaleClient.csproj -p:Platform=arm64 -c Release -r win-arm64 --self-contained true -o ./dist/arm64/

      - name: Create portable archives
        shell: pwsh
        run: |
          foreach ($arch in @('x64', 'arm64')) {
            $source = (Resolve-Path "./dist/$arch").Path
            $archive = Join-Path $PWD "dist/TailscaleFluent-portable-win-$arch.zip"
            [IO.Compression.ZipFile]::CreateFromDirectory($source, $archive)
          }

      - name: Upload portable archives
        uses: actions/upload-artifact@v4
        with:
          name: TailscaleFluent-portable
          path: dist/TailscaleFluent-portable-win-*.zip
          if-no-files-found: error
